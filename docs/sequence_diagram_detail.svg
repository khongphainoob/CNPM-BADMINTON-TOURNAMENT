<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11" fill="none" stroke="#222" stroke-width="1.3"/>
    </marker>
    <marker id="arrR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11" fill="none" stroke="#222" stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .head { fill:#fff; stroke:#222; stroke-width:1.2; }
    .name { text-anchor:middle; font-size:12px; }
    .undl { text-decoration:underline; }
    .life { stroke:#222; stroke-width:1; stroke-dasharray:5 4; }
    .act  { fill:#fff; stroke:#222; stroke-width:1.2; }
    .msg  { stroke:#222; stroke-width:1.2; fill:none; }
    .ret  { stroke:#222; stroke-width:1.2; fill:none; stroke-dasharray:5 4; }
    .lbl  { font-size:11px; }
    .cap  { font-size:24px; font-weight:bold; text-anchor:middle; fill:#1F4FD8; }
    .fig  { stroke:#222; stroke-width:1.4; fill:none; }
  </style>

  <text class="cap" x="480" y="30">Sequence chi tiết — Ghi điểm trận đấu</text>

  <!-- ===== Actor left : Trọng tài ===== -->
  <g class="fig">
    <circle cx="55" cy="70" r="9"/>
    <line x1="55" y1="79" x2="55" y2="104"/>
    <line x1="38" y1="88" x2="72" y2="88"/>
    <line x1="55" y1="104" x2="42" y2="124"/>
    <line x1="55" y1="104" x2="68" y2="124"/>
  </g>
  <text class="name undl" x="55" y="142">: Trọng tài</text>

  <!-- ===== Boundary / control / entity heads ===== -->
  <rect class="head" x="160" y="92" width="120" height="30"/>
  <text class="name undl" x="220" y="111">ScoreForm</text>

  <rect class="head" x="340" y="92" width="130" height="30"/>
  <text class="name undl" x="405" y="111">MatchController</text>

  <rect class="head" x="530" y="92" width="125" height="30"/>
  <text class="name undl" x="592" y="111">ScoringService</text>

  <rect class="head" x="710" y="92" width="150" height="30"/>
  <text class="name undl" x="785" y="111">LeaderboardService</text>

  <!-- ===== Actor right : Server/DB ===== -->
  <g class="fig">
    <circle cx="915" cy="70" r="9"/>
    <line x1="915" y1="79" x2="915" y2="104"/>
    <line x1="898" y1="88" x2="932" y2="88"/>
    <line x1="915" y1="104" x2="902" y2="124"/>
    <line x1="915" y1="104" x2="928" y2="124"/>
  </g>
  <text class="name undl" x="915" y="142">: Server</text>

  <!-- ===== Lifelines ===== -->
  <line class="life" x1="55"  y1="124" x2="55"  y2="545"/>
  <line class="life" x1="220" y1="122" x2="220" y2="545"/>
  <line class="life" x1="405" y1="122" x2="405" y2="545"/>
  <line class="life" x1="592" y1="122" x2="592" y2="545"/>
  <line class="life" x1="785" y1="122" x2="785" y2="545"/>
  <line class="life" x1="915" y1="124" x2="915" y2="545"/>

  <!-- ===== Activation bars ===== -->
  <rect class="act" x="213" y="180" width="14" height="320"/>  <!-- ScoreForm -->
  <rect class="act" x="398" y="232" width="14" height="250"/>  <!-- MatchController -->
  <rect class="act" x="585" y="280" width="14" height="120"/>  <!-- ScoringService -->
  <rect class="act" x="908" y="318" width="14" height="34"/>   <!-- Server -->
  <rect class="act" x="778" y="430" width="14" height="34"/>   <!-- LeaderboardService -->

  <!-- ===== Messages ===== -->
  <!-- 1 startMatch -->
  <line class="msg" x1="55"  y1="180" x2="213" y2="180" marker-end="url(#arr)"/>
  <text class="lbl" x="70" y="174">1 : startMatch()</text>

  <!-- 2 start -->
  <line class="msg" x1="227" y1="240" x2="398" y2="240" marker-end="url(#arr)"/>
  <text class="lbl" x="240" y="234">2 : start(matchId)</text>

  <!-- 3 openMatch -> server -->
  <line class="msg" x1="412" y1="326" x2="908" y2="326" marker-end="url(#arr)"/>
  <text class="lbl" x="560" y="320">3 : openMatch()</text>
  <line class="ret" x1="908" y1="346" x2="412" y2="346" marker-end="url(#arr)"/>
  <text class="lbl" x="560" y="340">4 : ok()</text>

  <!-- 5 recordScore -->
  <line class="msg" x1="55"  y1="288" x2="213" y2="288" marker-end="url(#arr)"/>
  <text class="lbl" x="70" y="282">5 : recordScore(side)</text>

  <!-- 6 recordScore -> controller -->
  <line class="msg" x1="227" y1="370" x2="398" y2="370" marker-end="url(#arr)"/>
  <text class="lbl" x="232" y="364">6 : recordScore(matchId, side)</text>

  <!-- 7 append -> scoring -->
  <line class="msg" x1="412" y1="296" x2="585" y2="296" marker-end="url(#arr)"/>
  <text class="lbl" x="424" y="290">7 : append(event)</text>

  <!-- 8 showScore return -->
  <line class="ret" x1="213" y1="392" x2="55" y2="392" marker-end="url(#arr)"/>
  <text class="lbl" x="70" y="386">8 : showScore()</text>

  <!-- 9 finishMatch -->
  <line class="msg" x1="55"  y1="430" x2="213" y2="430" marker-end="url(#arr)"/>
  <text class="lbl" x="70" y="424">9 : finishMatch()</text>

  <!-- 10 finish -> controller -->
  <line class="msg" x1="227" y1="456" x2="398" y2="456" marker-end="url(#arr)"/>
  <text class="lbl" x="240" y="450">10 : finish(matchId)</text>

  <!-- 11 recompute -> leaderboard -->
  <line class="msg" x1="412" y1="442" x2="778" y2="442" marker-end="url(#arr)"/>
  <text class="lbl" x="500" y="436">11 : recompute(eventId)</text>

  <!-- 12 notifyResult return -->
  <line class="ret" x1="398" y1="476" x2="213" y2="476" marker-end="url(#arr)"/>
  <text class="lbl" x="240" y="470">12 : notifyResult()</text>
</svg>
