<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L11,6 L0,11" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    .head { fill:#fff; stroke:#222; stroke-width:1.6; }
    .name { font-weight:bold; text-anchor:middle; }
    .life { stroke:#222; stroke-width:1; stroke-dasharray:6 5; }
    .act  { fill:#fff; stroke:#222; stroke-width:1.4; }
    .msg  { stroke:#222; stroke-width:1.4; fill:none; }
    .lbl  { text-anchor:middle; }
    .cap  { font-size:26px; font-weight:bold; text-anchor:middle; fill:#1F4FD8; }
  </style>

  <text class="cap" x="380" y="34">Sequence — Ghi điểm trận đấu</text>

  <!-- ===== Lifeline heads ===== -->
  <rect class="head" x="40"  y="60" width="170" height="42"/>
  <text class="name" x="125" y="87">Trọng tài</text>
  <rect class="head" x="300" y="60" width="170" height="42"/>
  <text class="name" x="385" y="87">App</text>
  <rect class="head" x="560" y="60" width="170" height="42"/>
  <text class="name" x="645" y="87">Server</text>

  <!-- ===== Lifelines ===== -->
  <line class="life" x1="125" y1="102" x2="125" y2="450"/>
  <line class="life" x1="385" y1="102" x2="385" y2="450"/>
  <line class="life" x1="645" y1="102" x2="645" y2="450"/>

  <!-- ===== Activation bars ===== -->
  <rect class="act" x="118" y="150" width="14" height="250"/>   <!-- Trọng tài -->
  <rect class="act" x="378" y="168" width="14" height="40"/>    <!-- App: chọn trận -->
  <rect class="act" x="378" y="226" width="14" height="62"/>    <!-- App: ghi điểm -->
  <rect class="act" x="378" y="330" width="14" height="44"/>    <!-- App: kết thúc -->
  <rect class="act" x="638" y="240" width="14" height="34"/>    <!-- Server: verify -->

  <!-- ===== Messages ===== -->
  <!-- chọn trận -->
  <line class="msg" x1="132" y1="170" x2="378" y2="170" marker-end="url(#arr)"/>
  <text class="lbl" x="255" y="164">chọnTrận</text>
  <line class="msg" x1="378" y1="196" x2="132" y2="196" marker-end="url(#arr)"/>
  <text class="lbl" x="255" y="190">hiệnSân</text>

  <!-- bắt đầu + verify -->
  <line class="msg" x1="132" y1="240" x2="378" y2="240" marker-end="url(#arr)"/>
  <text class="lbl" x="255" y="234">bắtĐầuTrận</text>
  <line class="msg" x1="392" y1="252" x2="638" y2="252" marker-end="url(#arr)"/>
  <text class="lbl" x="515" y="246">mởTrận</text>
  <line class="msg" x1="638" y1="268" x2="392" y2="268" marker-end="url(#arr)"/>
  <text class="lbl" x="515" y="262">ok</text>
  <line class="msg" x1="378" y1="284" x2="132" y2="284" marker-end="url(#arr)"/>
  <text class="lbl" x="255" y="278">bảngĐiểm</text>

  <!-- ghi điểm -->
  <line class="msg" x1="132" y1="344" x2="378" y2="344" marker-end="url(#arr)"/>
  <text class="lbl" x="255" y="338">ghiĐiểm</text>
  <line class="msg" x1="378" y1="370" x2="132" y2="370" marker-end="url(#arr)"/>
  <text class="lbl" x="255" y="364">cậpNhậtĐiểm</text>
</svg>
