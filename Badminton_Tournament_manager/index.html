<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>Shuttle·Ops — Nền tảng quản lý giải cầu lông</title>
<meta name="viewport" content="width=1440"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="styles.css"/>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Data + primitives first, then features -->
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/auth.jsx"></script>
<script type="text/babel" src="src/shell.jsx"></script>
<script type="text/babel" src="src/btc_dashboard.jsx"></script>
<script type="text/babel" src="src/btc_views.jsx"></script>
<script type="text/babel" src="src/referee.jsx"></script>
<script type="text/babel" src="src/public_views.jsx"></script>
<script type="text/babel" src="src/login.jsx"></script>
<script type="text/babel" src="src/admin.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState: useS_app, useEffect: useE_app } = React;

/* Tweakable defaults — edited live by the Tweaks panel */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent":      "#D22F2F",
  "accentMode":  "red",
  "density":     "comfortable",
  "sidebarOpen": true
}/*EDITMODE-END*/;

function App() {
  const { session, login, logout, register } = useAuth();
  const [lang, setLang] = useLang();
  const [view, setView] = useS_app(() => {
    try { return localStorage.getItem('bad.view') || 'dashboard'; } catch { return 'dashboard'; }
  });
  useE_app(() => { try { localStorage.setItem('bad.view', view); } catch {} }, [view]);

  const [tweaks, setTweaks] = useS_app(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useS_app(false);

  /* Host ↔ Tweaks protocol */
  useE_app(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  /* Apply tweaks as CSS vars */
  useE_app(() => {
    const r = document.documentElement;
    const accentMap = {
      red:   ['oklch(0.55 0.20 25)',  'oklch(0.42 0.20 25)'],
      amber: ['oklch(0.72 0.16 70)',  'oklch(0.48 0.15 70)'],
      teal:  ['oklch(0.60 0.13 180)', 'oklch(0.38 0.10 180)'],
      ink:   ['oklch(0.28 0.01 250)', 'oklch(0.20 0.01 250)'],
    };
    const [a, ai] = accentMap[tweaks.accentMode] || accentMap.red;
    r.style.setProperty('--accent', a);
    r.style.setProperty('--accent-ink', ai);
    r.style.setProperty('--row-pad', tweaks.density === 'compact' ? '7px 12px' : '10px 12px');
  }, [tweaks.accentMode, tweaks.density]);

  /* Not logged in — show auth screen */
  if (!session) {
    return <AuthScreen onLogin={login} onRegister={register}/>;
  }

  const role = session.role;
  const topBarProps = { session, onLogout: logout, lang, setLang };

  /* Route by role */
  let surface;
  if (role === 'admin') {
    surface = <AdminView session={session} onLogout={logout} lang={lang} setLang={setLang} sidebarOpen={tweaks.sidebarOpen}/>;
  } else if (role === 'btc') {
    const views = {
      dashboard: <DashboardView/>,
      schedule:  <ScheduleView/>,
      bracket:   <BracketView/>,
      athletes:  <AthletesView/>,
      courts:    <CourtsView/>,
      inventory: <InventoryView/>,
      referees:  <RefereesView/>,
      finance:   <FinanceView/>,
      news:      <NewsView/>,
      reports:   <ReportsView/>,
      settings:  <SettingsView/>,
    };
    surface = (
      <div style={{ display:'grid', gridTemplateAreas:'"top top" "side main"', gridTemplateRows:'56px 1fr', gridTemplateColumns: tweaks.sidebarOpen ? '232px 1fr' : '64px 1fr', height:'100vh' }}>
        <TopBar {...topBarProps}/>
        <Sidebar view={view} setView={setView}/>
        <main style={{ gridArea:'main', overflowY:'auto', background:'var(--paper-2)' }} data-screen-label={`BTC · ${view}`}>
          {views[view] || <DashboardView/>}
        </main>
      </div>
    );
  } else if (role === 'referee') {
    surface = (
      <div style={{ display:'grid', gridTemplateAreas:'"top" "main"', gridTemplateRows:'56px 1fr', height:'100vh' }}>
        <TopBar {...topBarProps}/>
        <main style={{ gridArea:'main', overflowY:'auto' }} data-screen-label="Referee mobile"><RefereeView/></main>
      </div>
    );
  } else if (role === 'athlete') {
    surface = (
      <div style={{ display:'grid', gridTemplateAreas:'"top" "main"', gridTemplateRows:'56px 1fr', height:'100vh' }}>
        <TopBar {...topBarProps}/>
        <main style={{ gridArea:'main', overflow:'hidden' }} data-screen-label="Athlete portal"><AthleteView/></main>
      </div>
    );
  } else {
    /* Spectator / unauthenticated — public view */
    surface = (
      <div style={{ display:'grid', gridTemplateAreas:'"top" "main"', gridTemplateRows:'56px 1fr', height:'100vh' }}>
        <TopBar {...topBarProps}/>
        <main style={{ gridArea:'main', overflow:'clip' }} data-screen-label="Public site"><SpectatorView/></main>
      </div>
    );
  }

  return (
    <>
      {surface}
      {tweaksOpen && <TweaksPanel tweaks={tweaks} update={updateTweak} onClose={() => setTweaksOpen(false)}/>}
    </>
  );
}

function TweaksPanel({ tweaks, update, onClose }) {
  return (
    <div style={{
      position:'fixed', right: 20, bottom: 20, zIndex: 9999,
      width: 280, background:'var(--paper)', border:'1px solid var(--line)',
      borderRadius: 10, boxShadow:'0 20px 40px -10px oklch(0 0 0 / 0.2)',
      fontSize: 12.5,
    }}>
      <div style={{ padding:'12px 14px', borderBottom:'1px solid var(--line)', display:'flex', alignItems:'center' }}>
        <div style={{ fontWeight: 600 }}>Tweaks</div>
        <div style={{ flex:1 }}/>
        <button onClick={onClose} style={{ border:0, background:'transparent', color:'var(--ink-3)' }}>✕</button>
      </div>
      <div style={{ padding: 14, display:'flex', flexDirection:'column', gap: 14 }}>
        <div>
          <div className="caps" style={{ marginBottom: 6 }}>Màu nhấn</div>
          <div style={{ display:'flex', gap: 6 }}>
            {[['red','Đỏ'],['amber','Vàng'],['teal','Ngọc'],['ink','Mực']].map(([id,l]) => (
              <button key={id} onClick={() => update('accentMode', id)} style={{
                flex: 1, padding:'8px 0', borderRadius: 5, fontSize: 11,
                border:'1px solid ' + (tweaks.accentMode===id?'var(--ink)':'var(--line)'),
                background: tweaks.accentMode===id?'var(--ink)':'var(--paper)',
                color: tweaks.accentMode===id?'white':'var(--ink-2)',
              }}>{l}</button>
            ))}
          </div>
        </div>
        <div>
          <div className="caps" style={{ marginBottom: 6 }}>Mật độ bảng</div>
          <div style={{ display:'flex', gap: 6 }}>
            {[['comfortable','Thoáng'],['compact','Gọn']].map(([id,l]) => (
              <button key={id} onClick={() => update('density', id)} style={{
                flex: 1, padding:'8px 0', borderRadius: 5, fontSize: 11,
                border:'1px solid ' + (tweaks.density===id?'var(--ink)':'var(--line)'),
                background: tweaks.density===id?'var(--ink)':'var(--paper)',
                color: tweaks.density===id?'white':'var(--ink-2)',
              }}>{l}</button>
            ))}
          </div>
        </div>
        <div>
          <div className="caps" style={{ marginBottom: 6 }}>Sidebar BTC</div>
          <div style={{ display:'flex', gap: 6 }}>
            {[[true,'Mở rộng'],[false,'Thu gọn']].map(([id,l]) => (
              <button key={String(id)} onClick={() => update('sidebarOpen', id)} style={{
                flex: 1, padding:'8px 0', borderRadius: 5, fontSize: 11,
                border:'1px solid ' + (tweaks.sidebarOpen===id?'var(--ink)':'var(--line)'),
                background: tweaks.sidebarOpen===id?'var(--ink)':'var(--paper)',
                color: tweaks.sidebarOpen===id?'white':'var(--ink-2)',
              }}>{l}</button>
            ))}
          </div>
        </div>
        <div style={{ fontSize: 11, color:'var(--ink-3)', lineHeight: 1.5, borderTop:'1px solid var(--line-2)', paddingTop: 10 }}>
          Các vai trò (BTC, trọng tài, VĐV, khán giả) chuyển trong thanh trên. Trạng thái xem, ngôn ngữ và các tweak được lưu cục bộ.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
