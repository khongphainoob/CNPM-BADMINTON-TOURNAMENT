<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>Shuttle·Ops — Print</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  @page { size: A4 landscape; margin: 0.4cm; }
  html, body {
    background: white;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    width: 29.1cm;
    height: 20.2cm;
    margin: 0 auto 0.4cm;
    background: var(--paper);
    border: 1px solid var(--line);
    overflow: hidden;
    page-break-after: always;
    break-after: page;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page-head {
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--ink);
    color: white;
    flex-shrink: 0;
  }
  .page-body { flex: 1; overflow: hidden; position: relative; }
  .page-body > * { height: 100%; }
  .cover {
    background: var(--ink);
    color: white;
    padding: 40px 50px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .cover-title {
    font-family: var(--font-display);
    font-size: 72px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    max-width: 18em;
  }
  @media print {
    body { margin: 0; }
    .page { margin: 0; border: none; box-shadow: none; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    button { cursor: default; }
  }
  @media screen {
    body { padding: 20px; background: oklch(0.92 0.008 250); }
  }
  /* Referee page: scale the phone frame down to fit */
  .scale-wrap { transform-origin: top left; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="btc_dashboard.jsx"></script>
<script type="text/babel" src="btc_views.jsx"></script>
<script type="text/babel" src="referee.jsx"></script>
<script type="text/babel" src="public_views.jsx"></script>

<script type="text/babel" data-presets="react">
const PageHead = ({ role, view, label }) => (
  <div className="page-head">
    <ShuttleMark size={20}/>
    <div style={{ fontFamily:'var(--font-display)', fontSize: 20, letterSpacing:'-0.01em' }}>
      Shuttle<span style={{ color:'var(--accent)' }}>·</span>Ops
    </div>
    <div style={{ width: 1, height: 22, background:'oklch(0.32 0.01 250)' }}/>
    <div style={{ fontSize: 12, fontWeight: 500 }}>{role}</div>
    <div style={{ color:'oklch(0.7 0.01 250)', fontSize: 11.5 }}>· {view}</div>
    <div style={{ flex: 1 }}/>
    <div className="mono" style={{ fontSize: 10, color:'oklch(0.7 0.01 250)' }}>{label}</div>
  </div>
);

function PrintApp() {
  return (
    <>
      {/* 1. Cover */}
      <div className="page">
        <div className="cover">
          <div>
            <div className="caps" style={{ color:'oklch(0.72 0.01 250)' }}>Shuttle·Ops · Tournament Operations Platform</div>
            <div style={{ marginTop: 16, fontSize: 14, color:'oklch(0.8 0.01 250)' }}>Hồ sơ thiết kế · prototype hi-fi · tháng 4 / 2026</div>
          </div>
          <div className="cover-title">
            Nền tảng quản lý giải <span style={{ color:'var(--accent)' }}>cầu lông</span> — bốn vai trò, một hệ thống.
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 20, color:'oklch(0.85 0.01 250)', fontSize: 12.5 }}>
            <div><div className="caps" style={{ color:'oklch(0.65 0.01 250)' }}>01 · Ban tổ chức</div><div style={{ marginTop: 4 }}>Tổng quan · Lịch thi đấu · Bảng đấu · VĐV · Kho cầu · Tài chính · Báo cáo</div></div>
            <div><div className="caps" style={{ color:'oklch(0.65 0.01 250)' }}>02 · Trọng tài</div><div style={{ marginTop: 4 }}>Ứng dụng mobile nhập điểm thời gian thực · chế độ ngoại tuyến</div></div>
            <div><div className="caps" style={{ color:'oklch(0.65 0.01 250)' }}>03 · Vận động viên</div><div style={{ marginTop: 4 }}>Đăng ký giải · hồ sơ · lịch trận của tôi · BXH quốc gia</div></div>
            <div><div className="caps" style={{ color:'oklch(0.65 0.01 250)' }}>04 · Khán giả</div><div style={{ marginTop: 4 }}>Lịch, kết quả, bảng đấu, mua vé trực tuyến</div></div>
          </div>
        </div>
      </div>

      {/* 2. BTC Dashboard */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Tổng quan" label="01 / BTC-DASHBOARD"/>
        <div className="page-body"><DashboardView/></div>
      </div>

      {/* 3. BTC Schedule */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Lịch thi đấu" label="02 / BTC-SCHEDULE"/>
        <div className="page-body"><ScheduleView/></div>
      </div>

      {/* 4. BTC Bracket */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Bảng đấu" label="03 / BTC-BRACKET"/>
        <div className="page-body" style={{ overflow:'auto' }}><BracketView/></div>
      </div>

      {/* 5. BTC Athletes */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Vận động viên" label="04 / BTC-ATHLETES"/>
        <div className="page-body"><AthletesView/></div>
      </div>

      {/* 6. BTC Courts */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Sân & điều phối" label="05 / BTC-COURTS"/>
        <div className="page-body"><CourtsView/></div>
      </div>

      {/* 7. BTC Inventory */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Kho cầu" label="06 / BTC-INVENTORY"/>
        <div className="page-body"><InventoryView/></div>
      </div>

      {/* 8. BTC Finance */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Tài chính" label="07 / BTC-FINANCE"/>
        <div className="page-body"><FinanceView/></div>
      </div>

      {/* 9. BTC Reports */}
      <div className="page">
        <PageHead role="Ban tổ chức" view="Báo cáo" label="08 / BTC-REPORTS"/>
        <div className="page-body"><ReportsView/></div>
      </div>

      {/* 10. Referee */}
      <div className="page">
        <PageHead role="Trọng tài" view="Ứng dụng nhập điểm" label="09 / REF-MOBILE"/>
        <div className="page-body" style={{ background: 'var(--paper-2)' }}><RefereeView/></div>
      </div>

      {/* 11. Athlete portal */}
      <div className="page">
        <PageHead role="Vận động viên" view="Cổng đăng ký & hồ sơ" label="10 / ATHLETE-PORTAL"/>
        <div className="page-body"><AthleteView/></div>
      </div>

      {/* 12. Spectator */}
      <div className="page">
        <PageHead role="Khán giả" view="Trang giải đấu công khai" label="11 / PUBLIC-SITE"/>
        <div className="page-body"><SpectatorView/></div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp/>);

/* Auto-print after fonts + babel + delay */
(async () => {
  try { await document.fonts.ready; } catch {}
  setTimeout(() => { try { window.print(); } catch {} }, 1200);
})();
</script>
</body>
</html>
